[project]
name = "running-stats"
version = "0.2.0"
description = "Library for computing linear statistics."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Språkbanken Text", email = "sb-info@svenska.gu.se" }]
classifiers = [
  "Development Status :: 4 - Beta",
  # "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  # "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  # "uncomment if you test on these interpreters:",
  # "Programming Language :: Python :: Implementation :: IronPython",
  # "Programming Language :: Python :: Implementation :: Jython",
  # "Programming Language :: Python :: Implementation :: Stackless",
  "Topic :: Utilities",
]
dependencies = ["attrs>=25.1.0"]

[project.urls]
Homepage = "https://spraakbanken.gu.se"
Issues = "https://github.com/spraakbanken/running-stats-py/issues"
Repository = "https://github.com/spraakbanken/running-stats-py"

[dependency-groups]
dev = ["mypy>=1.15.0", "pytest>=8.3.4", "pytest-cov>=6.0.0", "ruff>=0.9.7"]

[build-system]
requires = ["uv_build>=0.9.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "P7D"
